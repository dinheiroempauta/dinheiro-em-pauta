<title>CAGR por Tamanho de Janela</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-real:    #2a78d6;
    --series-nominal: #eb6834;
    --accent-track:   #e1e0d9;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-real:    #3987e5;
      --series-nominal: #d95926;
      --accent-track:   #2c2c2a;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-real:    #3987e5;
    --series-nominal: #d95926;
    --accent-track:   #2c2c2a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
  }
  .viz-root {
    max-width: 920px;
    margin: 32px auto;
    padding: 28px 28px 20px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 20px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
    padding: 14px 16px;
    background: var(--page);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .controls label {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .controls .value {
    font-weight: 600;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--accent-track);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--series-real);
    border: 2px solid var(--surface-1);
    box-shadow: 0 0 0 1px var(--border);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--series-real);
    border: 2px solid var(--surface-1);
    box-shadow: 0 0 0 1px var(--border);
    cursor: pointer;
  }

  .legend {
    display: flex;
    gap: 20px;
    margin-bottom: 6px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .legend-item { display: flex; align-items: center; gap: 7px; }
  .legend-swatch { width: 16px; height: 2px; border-radius: 1px; }
  .chart-wrap { position: relative; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .gridline { stroke: var(--gridline); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }
  .axis-label { fill: var(--text-muted); font-size: 11px; }
  .series-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .end-dot { r: 4; stroke-width: 2; stroke: var(--surface-1); }
  .end-label { font-size: 12px; font-weight: 600; }
  .crosshair { stroke: var(--text-muted); stroke-width: 1; opacity: 0; pointer-events: none; }
  .hover-dot { r: 4; stroke-width: 2; stroke: var(--surface-1); opacity: 0; pointer-events: none; }
  .hit-layer { fill: transparent; cursor: crosshair; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    opacity: 0;
    transition: opacity 0.08s;
    white-space: nowrap;
    z-index: 10;
  }
  .tooltip-date {
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .tooltip-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .tooltip-key { width: 10px; height: 2px; border-radius: 1px; flex-shrink: 0; }
  .tooltip-value { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .tooltip-name { color: var(--text-secondary); margin-left: 2px; }

  .stats-row {
    display: flex;
    gap: 24px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--gridline);
    flex-wrap: wrap;
  }
  .stat {
    font-size: 12px;
    color: var(--text-muted);
  }
  .stat .stat-value {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }

  .footnote {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 14px;
    line-height: 1.5;
  }

  .toggle-table {
    font-size: 12px;
    color: var(--text-secondary);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    margin-top: 12px;
  }
  .toggle-table:hover { background: var(--gridline); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-top: 14px;
    display: none;
  }
  table.visible { display: table; }
  th, td {
    text-align: right;
    padding: 5px 8px;
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--gridline);
  }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-muted); font-weight: 500; }
  td { color: var(--text-primary); }
  .table-scroll { max-height: 320px; overflow-y: auto; overflow-x: auto; }
</style>

<div class="viz-root">
  <h1 id="title">CAGR em janelas móveis</h1>
  <p class="subtitle" id="subtitle"></p>

  <div class="controls">
    <label for="windowSlider">Tamanho da janela</label>
    <input type="range" id="windowSlider" min="1" max="15" step="1" value="10" />
    <span class="value"><span id="sliderValue">10</span> ano(s)</span>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="legend-swatch" style="background:var(--series-real)"></span>Real (descontada a inflação)</div>
    <div class="legend-item"><span class="legend-swatch" style="background:var(--series-nominal)"></span>Nominal</div>
  </div>

  <div class="chart-wrap">
    <svg id="chart" viewBox="0 0 880 380" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <div class="stats-row" id="statsRow"></div>

  <button class="toggle-table" id="toggleTable">Ver como tabela</button>
  <div class="table-scroll">
    <table id="dataTable">
      <thead>
        <tr><th>Início da janela</th><th>Fim da janela</th><th>CAGR real</th><th>CAGR nominal</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <p class="footnote" id="footnote"></p>
</div>

  const svg = document.getElementById('chart');

    const firstTick = Math.ceil(yMin / yStep) * yStep;
    for (let v = firstTick; v <= yMax + 1e-9; v += yStep) {
      const yy = y(v);
      svg.appendChild(el('line', { x1: M.left, x2: W - M.right, y1: yy, y2: yy, class: 'gridline' }));
      const label = el('text', { x: M.left - 8, y: yy + 4, class: 'axis-label', 'text-anchor': 'end' });
      label.textContent = (v * 100).toFixed(0) + '%';
      svg.appendChild(label);
    }
    const baselineY = y(Math.max(yMin, 0));
    svg.appendChild(el('line', { x1: M.left, x2: W - M.right, y1: baselineY, y2: baselineY, class: 'baseline' }));

    // x-axis year ticks
    const years = [...new Set(dates.map(d => d.getFullYear()))];
    const yearStep = years.length > 12 ? 2 : 1;
    years.forEach(yr => {
      if (yr % yearStep !== 0) return;
      const t = new Date(yr, 0, 1).getTime();
      if (t < xMin || t > xMax) return;
      const xx = x(t);
      const label = el('text', { x: xx, y: H - M.bottom + 18, class: 'axis-label', 'text-anchor': 'middle' });
      label.textContent = yr;
      svg.appendChild(label);
    });

    function pathFor(key) {
      return data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${x(dates[i].getTime())} ${y(d[key])}`).join(' ');
    }

    const pathReal = el('path', { d: pathFor('cagr_real'), class: 'series-line', stroke: colorReal });
    const pathNominal = el('path', { d: pathFor('cagr_nominal'), class: 'series-line', stroke: colorNominal });
    svg.appendChild(pathNominal);
    svg.appendChild(pathReal);

    // end dots + direct labels
    const last = data[data.length - 1];
    const lastX = x(dates[dates.length - 1].getTime());
    svg.appendChild(el('circle', { cx: lastX, cy: y(last.cagr_real), class: 'end-dot', fill: colorReal }));
    svg.appendChild(el('circle', { cx: lastX, cy: y(last.cagr_nominal), class: 'end-dot', fill: colorNominal }));

    const labelReal = el('text', { x: lastX + 8, y: y(last.cagr_real) + 4, class: 'end-label', fill: colorReal });
    labelReal.textContent = fmtPct(last.cagr_real);
    svg.appendChild(labelReal);

    const labelNominal = el('text', { x: lastX + 8, y: y(last.cagr_nominal) + 4, class: 'end-label', fill: colorNominal });
    labelNominal.textContent = fmtPct(last.cagr_nominal);
    svg.appendChild(labelNominal);

    // crosshair + hover dots
    const crosshair = el('line', { x1: 0, x2: 0, y1: M.top, y2: M.top + plotH, class: 'crosshair' });
    const hoverReal = el('circle', { class: 'hover-dot', fill: colorReal });
    const hoverNominal = el('circle', { class: 'hover-dot', fill: colorNominal });
    svg.appendChild(crosshair);
    svg.appendChild(hoverReal);
    svg.appendChild(hoverNominal);

    const hit = el('rect', { x: M.left, y: M.top, width: plotW, height: plotH, class: 'hit-layer' });
    svg.appendChild(hit);

    function nearestIndex(px) {
      const t = xMin + ((px - M.left) / plotW) * (xMax - xMin);
      let best = 0, bestDist = Infinity;
      dates.forEach((d, i) => {
        const dist = Math.abs(d.getTime() - t);
        if (dist < bestDist) { bestDist = dist; best = i; }
      });
      return best;
    }

    function showAt(clientX, rectLeft, scale) {
      const px = (clientX - rectLeft) / scale;
      const i = nearestIndex(px);
      const d = data[i];
      const xx = x(dates[i].getTime());

      crosshair.setAttribute('x1', xx);
      crosshair.setAttribute('x2', xx);
      crosshair.style.opacity = 1;

      hoverReal.setAttribute('cx', xx);
      hoverReal.setAttribute('cy', y(d.cagr_real));
      hoverReal.style.opacity = 1;
      hoverNominal.setAttribute('cx', xx);
      hoverNominal.setAttribute('cy', y(d.cagr_nominal));
      hoverNominal.style.opacity = 1;

      tooltip.innerHTML = '';
      const dateEl = document.createElement('div');
      dateEl.className = 'tooltip-date';
      dateEl.textContent = 'Janela ' + fmtDate(parseDate(d.data_inicio)) + ' – ' + fmtDate(parseDate(d.data_fim));
      tooltip.appendChild(dateEl);

      [['Real', d.cagr_real, colorReal], ['Nominal', d.cagr_nominal, colorNominal]].forEach(([name, val, color]) => {
        const row = document.createElement('div');
        row.className = 'tooltip-row';
        const key = document.createElement('span');
        key.className = 'tooltip-key';
        key.style.background = color;
        const value = document.createElement('span');
        value.className = 'tooltip-value';
        value.textContent = fmtPct(val);
        const nameEl = document.createElement('span');
        nameEl.className = 'tooltip-name';
        nameEl.textContent = name;
        row.appendChild(key);
        row.appendChild(value);
        row.appendChild(nameEl);
        tooltip.appendChild(row);
      });

      const svgRect = svg.getBoundingClientRect();
      const scaleX = svgRect.width / W;
      let left = xx * scaleX + 14;
      if (left + 160 > svgRect.width) left = xx * scaleX - 174;
      tooltip.style.left = left + 'px';
      tooltip.style.top = (y(Math.max(d.cagr_real, d.cagr_nominal)) * (svgRect.height / H) - 10) + 'px';
      tooltip.style.opacity = 1;
    }

    function hide() {
      crosshair.style.opacity = 0;
      hoverReal.style.opacity = 0;
      hoverNominal.style.opacity = 0;
      tooltip.style.opacity = 0;
    }

    hit.addEventListener('pointermove', e => {
      const rect = svg.getBoundingClientRect();
      showAt(e.clientX, rect.left, rect.width / W);
    });
    hit.addEventListener('pointerleave', hide);

    // header text
    const meses = anos * 12;
    document.getElementById('title').textContent =
      `CAGR em janelas móveis de ${anos} ano${anos > 1 ? 's' : ''}`;
    document.getElementById('subtitle').textContent =
      `${data.length} janela${data.length > 1 ? 's' : ''} possíve${data.length > 1 ? 'is' : 'l'} de ${meses} meses entre jan/2006 e jun/2026 · cada ponto = uma janela começando no mês indicado`;
    document.getElementById('footnote').innerHTML =
      `Cada janela cobre exatamente ${meses} meses. O eixo X usa o mês final da janela. ` +
      `Fonte: internal/estatisticas-carteira-aposentadoria/output/janelas_detalhado.csv`;

    // summary stats row
    const reais = data.map(d => d.cagr_real);
    const min = Math.min(...reais), max = Math.max(...reais);
    const mediana = [...reais].sort((a, b) => a - b)[Math.floor(reais.length / 2)];
    const statsRow = document.getElementById('statsRow');
    statsRow.innerHTML = '';
    [
      ['Pior janela (real)', fmtPct(min)],
      ['Mediana (real)', fmtPct(mediana)],
      ['Melhor janela (real)', fmtPct(max)],
    ].forEach(([label, value]) => {
      const div = document.createElement('div');
      div.className = 'stat';
      div.textContent = label;
      const span = document.createElement('span');
      span.className = 'stat-value';
      span.textContent = value;
      div.appendChild(span);
      statsRow.appendChild(div);
    });

    // table view
    const tbody = document.querySelector('#dataTable tbody');
    tbody.innerHTML = '';
    data.forEach(d => {
      const tr = document.createElement('tr');
      const cells = [
        fmtDate(parseDate(d.data_inicio)),
        fmtDate(parseDate(d.data_fim)),
        fmtPct(d.cagr_real),
        fmtPct(d.cagr_nominal),
      ];
      cells.forEach(text => {
        const td = document.createElement('td');
        td.textContent = text;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    state = { data };
  }

  const slider = document.getElementById('windowSlider');
  const sliderValue = document.getElementById('sliderValue');
  slider.addEventListener('input', () => {
    sliderValue.textContent = slider.value;
    render(slider.value);
  });

  const table = document.getElementById('dataTable');
  document.getElementById('toggleTable').addEventListener('click', function () {
    table.classList.toggle('visible');
    this.textContent = table.classList.contains('visible') ? 'Esconder tabela' : 'Ver como tabela';
  });

  render(slider.value);
})();
</script>
