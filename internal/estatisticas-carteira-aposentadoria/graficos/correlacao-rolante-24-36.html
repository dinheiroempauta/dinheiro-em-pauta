  const root = document.querySelector('.viz-root');
  const W = 920, H = 400;
  const M = { top: 16, right: 20, bottom: 34, left: 46 };

  const plotH = H - M.top - M.bottom;
  const ns = 'http://www.w3.org/2000/svg';
  const elx = (tag, attrs) => {
    const e = document.createElementNS(ns, tag);

  };

  const fmtNum = v => v.toFixed(2).replace('.', ',');

  const tooltip = document.getElementById('tooltip');
  const select = document.getElementById('pair-select');

  Object.keys(PAIR_LABELS).forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = PAIR_LABELS[key];
    select.appendChild(opt);
  });
  select.value = 'VWRA11_GOLD11';

  function parseMonth(s) {
    const [y, m] = s.split('-').map(Number);
    return y * 12 + (m - 1);
  }

  function render(pairKey) {
    const s24 = DATA['24'][pairKey];
    const s36 = DATA['36'][pairKey];

    document.getElementById('title').textContent = `Correlação rolante ${PAIR_LABELS[pairKey]}: 24 vs. 36 meses`;
    document.getElementById('subtitle').textContent =
      'Correlação de Pearson dos retornos mensais em janela deslizante, mês a mês, jan/2006–jun/2026';
    document.getElementById('footnote').textContent =
      'Eixo X: mês (data final da janela). Janela de 24 meses (linha sólida) reage mais rápido a mudanças de regime mas é mais ruidosa; janela de 36 meses (linha tracejada) é mais suave e estatisticamente estável, mas reage mais devagar. Faixas vermelhas marcam períodos de crise já identificados nos gráficos de drawdown. Fonte: internal/estatisticas-carteira-aposentadoria/output/base_consolidada.csv';

    svg.innerHTML = '';
    tooltip.style.opacity = 0;

    const allMonths = s24.map(d => parseMonth(d.data));
    const xMin = allMonths[0], xMax = parseMonth(s36[s36.length - 1].data);
    const xMinFull = parseMonth(s24[0].data);

    const allVals = s24.concat(s36).map(d => d.corr);
    const yMax = Math.min(1, Math.ceil(Math.max(...allVals) * 10 + 1) / 10);
    const yMin = Math.max(-1, Math.floor(Math.min(...allVals) * 10 - 1) / 10);

    const x = m => M.left + ((m - xMinFull) / (xMax - xMinFull)) * plotW;
    const y = v => M.top + plotH - ((v - yMin) / (yMax - yMin)) * plotH;

    // crisis bands
    CRISES.forEach(c => {
      const cStart = parseMonth(c.start), cEnd = parseMonth(c.end);
      if (cEnd < xMinFull || cStart > xMax) return;
      const x0 = x(Math.max(cStart, xMinFull));
      const x1 = x(Math.min(cEnd, xMax));
      svg.appendChild(elx('rect', { x: x0, y: M.top, width: Math.max(1, x1 - x0), height: plotH, fill: 'var(--crisis-band)' }));
      const label = elx('text', { x: (x0 + x1) / 2, y: M.top + 12, class: 'crisis-label', 'text-anchor': 'middle' });
      label.textContent = c.label;
      svg.appendChild(label);
    });

    // gridlines
    const yStep = 0.25;

      const label = elx('text', { x: M.left - 8, y: yy + 4, class: 'axis-label', 'text-anchor': 'end' });

    for (let yr = startYear; yr * 12 <= xMax; yr += 2) {
      const xx = x(yr * 12);
      const label = elx('text', { x: xx, y: H - M.bottom + 18, class: 'axis-label', 'text-anchor': 'middle' });
      label.textContent = yr;
      svg.appendChild(label);

    const xAxisTitle = elx('text', { x: M.left + plotW / 2, y: H - 2, class: 'axis-label', 'text-anchor': 'middle' });

    svg.appendChild(xAxisTitle);

    function linePath(series) {
      return series.map((d, i) => `${i === 0 ? 'M' : 'L'} ${x(parseMonth(d.data))} ${y(d.corr)}`).join(' ');

    svg.appendChild(elx('path', { d: linePath(s36), class: 'line-36' }));
    svg.appendChild(elx('path', { d: linePath(s24), class: 'line-24' }));

    // crosshair + hover
    const crosshair = elx('line', { x1: 0, x2: 0, y1: M.top, y2: M.top + plotH, class: 'crosshair' });
    const hoverDot24 = elx('circle', { class: 'hover-dot', fill: 'var(--hue-line)' });
    const hoverDot36 = elx('circle', { class: 'hover-dot', fill: 'var(--hue-line)' });
    svg.appendChild(crosshair);
    svg.appendChild(hoverDot24);
    svg.appendChild(hoverDot36);

    const hit = elx('rect', { x: M.left, y: M.top, width: plotW, height: plotH, class: 'hit-layer' });
    svg.appendChild(hit);

    function nearestIndex(series, px) {
      const targetM = xMinFull + ((px - M.left) / plotW) * (xMax - xMinFull);

      return best;

    }

    hit.addEventListener('pointermove', e => {
      const rect = svg.getBoundingClientRect();
      showAt(e.clientX, rect.left, rect.width / W);
    });
    hit.addEventListener('pointerleave', hide);
  }

  select.addEventListener('change', () => render(select.value));
  render(select.value);
})();
</script>
