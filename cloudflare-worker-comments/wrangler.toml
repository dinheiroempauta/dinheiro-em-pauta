name = "independencia-comments"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Depois de rodar `wrangler d1 create independencia-comments-db`,
# cole aqui o "database_id" que o comando devolver.
[[d1_databases]]
binding = "DB"
database_name = "independencia-comments-db"
database_id = "COLE_AQUI_O_DATABASE_ID"
